<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Nilai - Pemrograman Web</title>
  <link rel="stylesheet" href="style.css">
  <!-- Urutan penting: data -> api -> nilai -> app.
       defer = file dijalankan setelah HTML selesai dibaca (elemen sudah ada). -->
  <script src="data.js" defer></script>
  <script src="api.js" defer></script>
  <script src="nilai.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Rekap Nilai Pemrograman Web</h1>
    <p>Data dari <code>api.js</code> (Promise + localStorage) &middot; nilai akhir &amp; grade dihitung oleh <code>nilai.js</code></p>
  </header>

  <main>
    <section class="statistik" aria-label="Statistik kelas">
      <div class="kartu"><span class="label">Jumlah</span><span id="stat-jumlah" class="angka">-</span></div>
      <div class="kartu"><span class="label">Lulus</span><span id="stat-lulus" class="angka">-</span></div>
      <div class="kartu"><span class="label">Rata-rata</span><span id="stat-rata" class="angka">-</span></div>
      <div class="kartu"><span class="label">Tertinggi</span><span id="stat-tertinggi" class="angka kecil">-</span></div>
      <div class="kartu lebar"><span class="label">Distribusi grade</span><span id="stat-distribusi" class="angka kecil">-</span></div>
    </section>

    <section>
      <h2>Tambah Mahasiswa</h2>
      <form id="form-mahasiswa" novalidate>
        <input name="nim" placeholder="NIM (7 digit)" inputmode="numeric" maxlength="7" required>
        <input name="nama" placeholder="Nama lengkap" required>
        <input name="tugas" type="number" min="0" max="100" placeholder="Tugas" required>
        <input name="uts" type="number" min="0" max="100" placeholder="UTS" required>
        <input name="uas" type="number" min="0" max="100" placeholder="UAS" required>
        <button type="submit">Simpan</button>
      </form>
      <p id="pesan" role="status"></p>
    </section>

    <section>
      <div class="judul-tabel">
        <h2>Daftar Nilai</h2>
        <div class="kontrol-tabel">
          <select id="filter-grade" aria-label="Filter grade">
            <option value="">Semua Grade</option>
            <option value="A">Grade A</option>
            <option value="B">Grade B</option>
            <option value="C">Grade C</option>
            <option value="D">Grade D</option>
            <option value="E">Grade E</option>
          </select>
          <input id="cari" type="search" placeholder="Cari nama..." autocomplete="off">
        </div>
      </div>
      <div class="bungkus-tabel">
        <table>
          <thead>
            <tr>
              <th data-kolom="nim">NIM</th>
              <th data-kolom="nama">Nama</th>
              <th data-kolom="tugas">Tugas</th>
              <th data-kolom="uts">UTS</th>
              <th data-kolom="uas">UAS</th>
              <th data-kolom="nilaiAkhir">Nilai Akhir</th>
              <th data-kolom="grade">Grade</th>
              <th data-kolom="lulus">Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-body">
            <tr><td colspan="9" class="kosong">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
